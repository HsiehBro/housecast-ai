services:
  backend:
    build: ./backend
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      - DJANGO_ENV=production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - DJANGO_ADMIN_PASSWORD=${DJANGO_ADMIN_PASSWORD:-admin123}
      - DB_NAME=houseprice
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_HOST=postgres
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/houses/')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
    restart: unless-stopped
    environment:
      - AMAP_SECURITY_KEY=${AMAP_SECURITY_KEY:-}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles:ro
      - backend_media:/app/media:ro

  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      - POSTGRES_DB=houseprice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_media:
  backend_static:
